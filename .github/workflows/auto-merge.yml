name: Auto Merge PDFs (secure)

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  validate-changed-files:
    name: Validate changed files are community/*.pdf
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine changed files (added or modified)
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          echo "Event: $GITHUB_EVENT_NAME"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BASE_REF="${{ github.event.pull_request.base.ref }}"
            echo "Base ref: $BASE_REF"
            git fetch origin "$BASE_REF"
            CHANGED=$(git diff --name-only --diff-filter=AM "origin/$BASE_REF...HEAD" || true)
          else
            if [ "${GITHUB_BEFORE}" = "0000000000000000000000000000000000000000" ]; then
              CHANGED=$(git diff-tree --no-commit-id --name-only -r "${GITHUB_SHA}" || true)
            else
              CHANGED=$(git diff --name-only --diff-filter=AM "${GITHUB_BEFORE}" "${GITHUB_SHA}" || true)
            fi
          fi
          echo "Changed files:\n$CHANGED"
          # Expose to later steps
          printf "%s" "$CHANGED" > changed_files.txt
          echo "files<<EOF" >> $GITHUB_OUTPUT
          printf "%s" "$CHANGED" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Enforce that all changed files are inside community/ and end with .pdf
        shell: bash
        run: |
          set -euo pipefail
          CHANGED=$(cat changed_files.txt)
          if [ -z "$CHANGED" ]; then
            echo "No added/modified files detected — failing for safety."
            exit 1
          fi
          INVALID_FOUND=0
          while IFS= read -r f; do
            # Ignore empty lines
            [ -z "$f" ] && continue
            if ! [[ "$f" =~ ^community/.*\.pdf$ ]]; then
              echo "Forbidden change detected: $f"
              INVALID_FOUND=1
            fi
          done <<< "$CHANGED"
          if [ "$INVALID_FOUND" -ne 0 ]; then
            echo "One or more changed files are outside community/ or not .pdf — failing workflow to block auto-merge."
            exit 1
          fi
          echo "All changed files are valid community/*.pdf"

  auto-merge:
    name: Auto-merge (runs only if validation passes)
    needs: validate-changed-files
    if: needs.validate-changed-files.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auto-merge PR
        uses: pascalgn/automerge-action@v0.16.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          merge_method: merge