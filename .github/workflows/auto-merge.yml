name: Auto Merge PDFs (secure)

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write
  checks: write

jobs:
  validate-changed-files:
    name: Validate changed files are community/*.pdf
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine changed files (added or modified)
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BASE_REF="${{ github.event.pull_request.base.ref }}"
            git fetch origin "$BASE_REF"
            git -c core.quotepath=false diff --name-only --diff-filter=AM "origin/$BASE_REF...HEAD" > changed_files.txt || true
          else
            if [ "${GITHUB_BEFORE}" = "0000000000000000000000000000000000000000" ]; then
              git -c core.quotepath=false diff-tree --no-commit-id --name-only -r "${GITHUB_SHA}" > changed_files.txt || true
            else
              git -c core.quotepath=false diff --name-only --diff-filter=AM "${GITHUB_BEFORE}" "${GITHUB_SHA}" > changed_files.txt || true
            fi
          fi
          echo "Detected files saved to changed_files.txt:"
          cat changed_files.txt

      - name: Enforce that all changed files are inside community/ and end with .pdf
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f changed_files.txt ]; then
            echo "No file list found — failing for safety."
            exit 1
          fi
          
          INVALID_FOUND=0
          while IFS= read -r f || [ -n "$f" ]; do
            [ -z "$f" ] && continue
            if ! [[ "$f" =~ ^community/.*\.pdf$ ]]; then
              echo "Forbidden change detected: $f"
              INVALID_FOUND=1
            fi
          done < changed_files.txt

          if [ "$INVALID_FOUND" -ne 0 ]; then
            echo "One or more changed files are outside community/ or not .pdf — failing workflow to block auto-merge."
            exit 1
          fi
          echo "All changed files are valid community/*.pdf"

  auto-merge:
    name: Auto-merge (runs only if validation passes)
    needs: validate-changed-files
    if: needs.validate-changed-files.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auto-merge PR
        uses: pascalgn/automerge-action@v0.16.0
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          MERGE_METHOD: "merge"
          MERGE_LABELS: ""
